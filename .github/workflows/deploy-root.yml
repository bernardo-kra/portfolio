name: Deploy root site to bernardo-kra.github.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-root-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Validate deploy key
        env:
          ACTIONS_DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        run: test -n "$ACTIONS_DEPLOY_KEY"

      - name: Wait for backend revision
        env:
          BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(process.env.BACKEND_URL || 'https://portfolio-backed-ll6j.onrender.com');
          if (base.protocol !== 'https:') throw new Error('Backend must use HTTPS');
          const health = new URL('/api/health', base);
          const deadline = Date.now() + 10 * 60 * 1000;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(health, { signal: AbortSignal.timeout(15000) });
              if (response.ok) {
                const data = await response.json();
                if (data.status === 'ok' && data.revision === process.env.EXPECTED_REVISION) {
                  console.log('Backend revision confirmed; frontend can be published.');
                  process.exit(0);
                }
              }
            } catch { /* Allow Render to finish building or wake up. */ }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Backend did not deploy this revision. Check the Render deployment before publishing the frontend.');
          NODE

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: bernardo-kra/bernardo-kra.github.io
          publish_branch: gh-pages
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          keep_files: false
